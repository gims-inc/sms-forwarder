[project]
name = "sms-forwarder-service"
version = "0.1.0"
description = "SMS forwarding service with monitoring, logging, and webhook support"
requires-python = ">= 3.11"
dependencies = [
    "fastapi[standard]",
    "aiosqlite",
    "httpx",
    "pydantic-settings",
    "python-dotenv",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-asyncio",
    "opentelemetry-instrumentation-sqlalchemy",
    "opentelemetry-exporter-otlp-proto-grpc",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[project.scripts]
api = "api.start:main"

[tool.pytest.ini_options]
pythonpath = "./src"
asyncio_mode = "auto"
